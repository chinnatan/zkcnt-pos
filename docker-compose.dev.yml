services:
  backend:
    build:
      context: ./backend
    ports:
      - "${API_HOST_PORT}:${PORT}"
    volumes:
      - ./backend/data:/data
    env_file:
      - .env
    networks:
      - pos-network

  frontend:
    image: oven/bun:1-alpine
    working_dir: /app
    command: sh -c "bun install && bun run dev -- --host 0.0.0.0"
    ports:
      - "${FRONTEND_HOST_PORT}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - pos-network

  db-admin:
    profiles: ["admin"]
    image: javimosch/adminer-node:latest
    ports:
      - "${DB_ADMIN_HOST_PORT:-8080}:8080"
    environment:
      ADMINER_HOST: 0.0.0.0
      ADMINER_PORT: 8080
      ADMINER_NO_OPEN: "1"
      ADMINER_BASIC_USER: ${DB_ADMIN_USER:-admin}
      ADMINER_BASIC_PASS: ${DB_ADMIN_PASS:-changeme}
      ADMINER_CONNECTIONS: |
        [{"label":"zKCNT POS","driver":"sqlite","server":"/data/pos.db","username":"","password":"","db":""}]
    volumes:
      - ./backend/data:/data:ro
    depends_on:
      - backend
    networks:
      - pos-network

volumes:
  frontend_node_modules:

networks:
  pos-network:
    driver: bridge
