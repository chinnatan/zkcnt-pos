<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- bg -->
  <rect width="32" height="32" fill="#f8fafc"/>
  <!-- outline -->
  <g fill="#0f172a">
    <rect x="8" y="5" width="4" height="3"/>
    <rect x="20" y="5" width="4" height="3"/>
    <rect x="7" y="8" width="18" height="1"/>
    <rect x="6" y="9" width="20" height="12"/>
    <rect x="7" y="21" width="18" height="1"/>
    <rect x="8" y="22" width="16" height="1"/>
    <rect x="14" y="24" width="11" height="1"/>
    <rect x="14" y="24" width="1" height="6"/>
    <rect x="24" y="24" width="1" height="6"/>
    <rect x="14" y="29" width="11" height="1"/>
  </g>
  <!-- fur -->
  <g fill="#64748b">
    <rect x="9" y="6" width="2" height="2"/>
    <rect x="21" y="6" width="2" height="2"/>
    <rect x="8" y="9" width="16" height="12"/>
    <rect x="9" y="21" width="14" height="1"/>
    <rect x="9" y="22" width="3" height="2"/>
  </g>
  <!-- inner ears -->
  <g fill="#94a3b8">
    <rect x="9" y="6" width="1" height="1"/>
    <rect x="22" y="6" width="1" height="1"/>
  </g>
  <!-- eyes -->
  <g fill="#0f172a">
    <rect x="10" y="12" width="3" height="3"/>
    <rect x="19" y="12" width="3" height="3"/>
  </g>
  <g fill="#ffffff">
    <rect x="10" y="12" width="1" height="1"/>
    <rect x="19" y="12" width="1" height="1"/>
  </g>
  <!-- nose -->
  <rect x="15" y="16" width="2" height="1" fill="#06b6d4"/>
  <!-- muzzle + whiskers -->
  <g fill="#e0f2fe">
    <rect x="13" y="17" width="2" height="2"/>
    <rect x="17" y="17" width="2" height="2"/>
    <rect x="15" y="19" width="2" height="1"/>
  </g>
  <g fill="#94a3b8">
    <rect x="6" y="14" width="2" height="1"/>
    <rect x="24" y="14" width="2" height="1"/>
    <rect x="6" y="17" width="2" height="1"/>
    <rect x="24" y="17" width="2" height="1"/>
  </g>
  <!-- pink blush -->
  <g fill="#22d3ee">
    <rect x="8" y="16" width="1" height="1"/>
    <rect x="23" y="16" width="1" height="1"/>
  </g>
  <!-- receipt paper -->
  <rect x="15" y="25" width="9" height="4" fill="#ffffff"/>
  <g fill="#94a3b8">
    <rect x="16" y="26" width="2" height="1"/>
    <rect x="16" y="28" width="3" height="1"/>
  </g>
  <!-- purple stamp mark -->
  <g fill="#06b6d4">
    <rect x="20" y="25" width="3" height="3"/>
  </g>
  <g fill="#ffffff">
    <rect x="21" y="26" width="1" height="1"/>
  </g>
</svg>
