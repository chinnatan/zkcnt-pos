<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-label="zKCNT POS">
  <defs>
    <linearGradient id="card" x1="256" y1="72" x2="256" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0f7fb"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="512" height="512" fill="#ffffff"/>

  <!-- Centered receipt card -->
  <g transform="translate(256 256)">
    <rect x="-176" y="-168" width="352" height="336" rx="32" fill="#5a8da8" opacity="0.08"/>
    <rect x="-184" y="-176" width="368" height="352" rx="34" fill="url(#card)" stroke="#b8dcef" stroke-width="4"/>

    <!-- Tear line -->
    <path
      d="M-148 -128 H148"
      stroke="#dceef7"
      stroke-width="5"
      stroke-linecap="round"
      stroke-dasharray="14 10"
    />

    <!-- zKCNT monogram -->
    <path
      fill="#3d6578"
      d="M-136 -88 H136 L-92 -8 H120 V48 H-136 L92 -32 H-136 V-88 Z"
    />

    <!-- Receipt lines -->
    <rect x="-120" y="62" width="176" height="18" rx="9" fill="#6ba8a0"/>
    <rect x="-120" y="88" width="128" height="18" rx="9" fill="#8fc8c0" opacity="0.85"/>
    <rect x="-120" y="114" width="80" height="18" rx="9" fill="#b8ded9" opacity="0.7"/>

    <!-- Paid check badge -->
    <circle cx="108" cy="98" r="48" fill="#6ba8a0"/>
    <path
      d="M84 98 L100 114 L134 82"
      stroke="#ffffff"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
